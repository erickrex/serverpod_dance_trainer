name: serverpod_dance_trainer_workspace
publish_to: none

environment:
  sdk: '^3.10.0'

# Dart pub workspaces (3.6+): a single `dart pub get` at the repo root
# resolves all member packages together and symlinks local path deps, so
# `dance_domain` changes are picked up by the server and Flutter app without
# a separate `dart pub get` in each. Every member below declares
# `resolution: workspace` in its own pubspec, which is what opts it in.
#
# `dance_trainer_flutter`, `dance_trainer_client` and `dance_trainer_server`
# were generated by `serverpod create` and moved up from the nested
# `dance_trainer/` directory it created, to match design.md's repo layout
# (these three live at repo root, sibling to `packages/`, not nested under
# their own wrapper folder). This file is what ties them back together
# after that move — `serverpod create` assumes it owns the root.
workspace:
  - packages/dance_domain
  - dance_trainer_server
  - dance_trainer_client
  - dance_trainer_flutter
dev_dependencies:
  dance_domain: any
  crypto: any
  yaml: ^3.1.3
